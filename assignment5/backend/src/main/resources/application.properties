server.port=8080
spring.application.name=vit-result-system

# Mongo DB Configuration (with fast connect timeout for offline fallback)
spring.data.mongodb.uri=mongodb://localhost:27017/vit_results?connectTimeoutMS=1000&socketTimeoutMS=1000&serverSelectionTimeoutMS=1000
spring.data.mongodb.auto-index-creation=false

# Logging
logging.level.com.vit.results=INFO
logging.level.org.springframework.data.mongodb=WARN
